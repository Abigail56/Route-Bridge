 </style>
</defs>
<rect width="1500" height="900" rx="26" fill="#f8fafc"/>
<text x="750" y="58" text-anchor="middle" class="title">RouteBridge — High-Level System Architecture</text>
<text x="750" y="88" text-anchor="middle" class="subtitle">Web and driver clients · FastAPI services · data stores · asynchronous processing</text>
