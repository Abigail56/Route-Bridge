# EXAMPLE ONLY - not part of any kustomization. Create the real Secret out of band (External Secrets Operator,
# Sealed Secrets, or `kubectl create secret generic routebridge-secrets --from-env-file=...`). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: routebridge-secrets
type: Opaque
stringData:
  ROUTEBRIDGE_DATABASE_URL: "postgresql+psycopg://routebridge:CHANGE_ME@db.internal:5432/routebridge?sslmode=require"
  ROUTEBRIDGE_REDIS_URL: "rediss://:CHANGE_ME@redis.internal:6379/0"
  ROUTEBRIDGE_WEBHOOK_SIGNING_SECRET: "generate: python -c 'import secrets; print(secrets.token_urlsafe(48))'"
  ROUTEBRIDGE_CLERK_WEBHOOK_SECRET: "whsec_... (Clerk Dashboard > Webhooks)"
  ROUTEBRIDGE_INTERNAL_API_KEY: "generate: python -c 'import secrets; print(secrets.token_urlsafe(32))'"
  ROUTEBRIDGE_DRIVER_TOKEN_SECRET: "generate: python -c 'import secrets; print(secrets.token_urlsafe(48))'"
  ROUTEBRIDGE_SMS_API_URL: "https://sms-gateway.example/send"
  ROUTEBRIDGE_SMS_API_KEY: "CHANGE_ME"
  ROUTEBRIDGE_S3_ACCESS_KEY: "CHANGE_ME"
  ROUTEBRIDGE_S3_SECRET_KEY: "CHANGE_ME"
  CLERK_SECRET_KEY: "CHANGE_ME"
