apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: routebridge
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: routebridge-web
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: CLERK_SECRET_KEY
              valueFrom: { secretKeyRef: { name: routebridge-secrets, key: CLERK_SECRET_KEY, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 100, runAsGroup: 101, capabilities: { drop: ["ALL"] } }
          startupProbe: { httpGet: { path: /, port: http }, periodSeconds: 3, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20, timeoutSeconds: 4 }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10, timeoutSeconds: 4 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: web }
