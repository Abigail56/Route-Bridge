apiVersion: v1
kind: ServiceAccount
metadata:
  name: routebridge
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: routebridge
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
      initContainers:
        # Every replica runs this before serving; the advisory lock serialises concurrent starters.
        - name: migrate
          image: routebridge-api
          command: ["python", "-m", "routebridge.tools.migrate"]
          envFrom:
            - configMapRef: { name: routebridge-config }
            - secretRef: { name: routebridge-secrets }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: api
          image: routebridge-api
          args: ["uvicorn", "routebridge.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: routebridge-config }
            - secretRef: { name: routebridge-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 3, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10, timeoutSeconds: 4 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api }
