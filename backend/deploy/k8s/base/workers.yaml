apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-worker
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: outbox-worker }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: outbox-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: outbox-worker }
    spec:
      serviceAccountName: routebridge
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: routebridge-api
          command: ["python", "-m", "routebridge.workers.outbox"]
          envFrom:
            - configMapRef: { name: routebridge-config }
            - secretRef: { name: routebridge-secrets }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
