---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maintenance
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: maintenance }
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: maintenance }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: routebridge
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: purge
              image: routebridge-api
              command: ["python", "-m", "routebridge.workers.maintenance"]
              envFrom:
                - configMapRef: { name: routebridge-config }
                - secretRef: { name: routebridge-secrets }
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: {} }]
