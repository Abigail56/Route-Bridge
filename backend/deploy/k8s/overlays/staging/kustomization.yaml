apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging mirrors production's shape (same manifests, same strict config validation) at smaller scale, with its own
# database, Redis, bucket, SMS sandbox credentials and Clerk instance. Never share secrets with production.
namespace: routebridge-staging
resources:
  - ../../base
configMapGenerator:
  - name: routebridge-config
    behavior: merge
    literals:
      - ROUTEBRIDGE_ENVIRONMENT=staging
      - ROUTEBRIDGE_ALLOWED_ORIGINS=["https://app.staging.routebridge.example"]
      - ROUTEBRIDGE_PUBLIC_TRACKING_BASE_URL=https://app.staging.routebridge.example/track
      - ROUTEBRIDGE_CLERK_ISSUER=https://clerk.staging.routebridge.example
      - ROUTEBRIDGE_CLERK_JWKS_URL=https://clerk.staging.routebridge.example/.well-known/jwks.json
      - ROUTEBRIDGE_S3_BUCKET=routebridge-media-staging
patches:
  - target: { kind: Ingress, name: routebridge }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: [app.staging.routebridge.example, api.staging.routebridge.example]
      - op: replace
        path: /spec/rules/0/host
        value: app.staging.routebridge.example
      - op: replace
        path: /spec/rules/1/host
        value: api.staging.routebridge.example
  - target: { kind: Deployment, name: "api|web" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
