apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api-canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api-canary }
  template:
    metadata:
      labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api-canary }
    spec:
      serviceAccountName: routebridge
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate
          image: routebridge-api-canary
          command: ["python", "-m", "routebridge.tools.migrate"]
          envFrom:
            - configMapRef: { name: routebridge-config }
            - secretRef: { name: routebridge-secrets }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: api
          image: routebridge-api-canary
          args: ["uvicorn", "routebridge.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: routebridge-config }
            - secretRef: { name: routebridge-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 3, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10, timeoutSeconds: 4 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  labels: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api-canary }
spec:
  selector: { app.kubernetes.io/name: routebridge, app.kubernetes.io/component: api-canary }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routebridge-api-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.routebridge.example]
      secretName: routebridge-tls
  rules:
    - host: api.routebridge.example
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api-canary, port: { name: http } } } }
