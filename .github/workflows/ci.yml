name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend/apps/api[test]"
      - name: Tests
        working-directory: backend
        env:
          PYTHONPATH: apps/api/src
        run: python -m pytest tests -q

  backend-postgres:
    name: Backend (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: rbtest
          POSTGRES_DB: routebridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d routebridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ROUTEBRIDGE_DATABASE_URL: postgresql+psycopg://postgres:rbtest@localhost:5432/routebridge
      ROUTEBRIDGE_POSTGRES_TEST_URL: postgresql+psycopg://postgres:rbtest@localhost:5432/routebridge
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend/apps/api[test]"
      - name: Migrations apply cleanly (twice, concurrently) and match the models
        working-directory: backend/apps/api
        run: |
          python -m routebridge.tools.migrate &
          python -m routebridge.tools.migrate &
          wait
          alembic check
      - name: Tests (real Postgres, PostGIS spatial path)
        working-directory: backend
        env:
          PYTHONPATH: apps/api/src
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/routebridge/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/routebridge/apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Driver app end-to-end (Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e "backend/apps/api"
      - name: Start API
        working-directory: backend/apps/api
        env:
          ROUTEBRIDGE_DATABASE_URL: sqlite:///./e2e.db
          ROUTEBRIDGE_MEDIA_DIR: ${{ github.workspace }}/e2e-media
          ROUTEBRIDGE_DRIVER_TOKEN_SECRET: ci-driver-secret-0123456789abcdef0123456789
          PYTHONPATH: src
        run: nohup uvicorn routebridge.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Build and start web
        working-directory: frontend/routebridge/apps/web
        run: |
          npm ci
          npm run build
          nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
        env:
          PORT: "3000"
          HOSTNAME: 0.0.0.0
      - name: Copy static assets next to the standalone server
        working-directory: frontend/routebridge/apps/web
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Run browser test
        working-directory: frontend/routebridge/apps/web/e2e
        env:
          RB_MEDIA_DIR: ${{ github.workspace }}/e2e-media
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: |
            frontend/routebridge/apps/web/e2e/out
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log

  compose:
    name: Docker Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci-password
          MINIO_ROOT_PASSWORD: ci-password
          DRIVER_TOKEN_SECRET: ci-driver-secret-0123456789abcdef
        run: docker compose config -q

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend/apps/api
          push: false
          tags: routebridge-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend/routebridge/apps/web
          push: false
          tags: routebridge-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
