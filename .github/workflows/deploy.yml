name: Deploy

# main        -> build images, deploy to STAGING automatically
# manual run  -> production: `canary` (10% of API traffic), `promote` (make that version stable), `rollback`
#
# Required secret in each GitHub Environment (staging, production): KUBE_CONFIG_B64 (base64 kubeconfig for that cluster).
# Required variables: NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, STAGING_API_URL.
# Configure the `production` environment with required reviewers.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Production action"
        type: choice
        required: true
        options: [canary, promote, rollback]
      image_tag:
        description: "Image tag (12-char git sha) to canary or promote; ignored for rollback"
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/apps/api
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/routebridge-api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend/routebridge/apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/routebridge-web:${{ steps.meta.outputs.tag }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      TAG: ${{ needs.build.outputs.tag }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: backend/deploy/k8s/overlays/staging
        run: |
          {
            echo "images:"
            echo "  - name: routebridge-api"
            echo "    newName: ${REGISTRY}/${OWNER}/routebridge-api"
            echo "    newTag: ${TAG}"
            echo "  - name: routebridge-web"
            echo "    newName: ${REGISTRY}/${OWNER}/routebridge-web"
            echo "    newTag: ${TAG}"
          } >> kustomization.yaml
          kubectl apply -k .
          # the ConfigMap name is stable, so restart to pick up configuration changes
          kubectl -n routebridge-staging rollout restart deployment/api deployment/web deployment/outbox-worker deployment/notification-worker
          kubectl -n routebridge-staging rollout status deployment/api --timeout=300s
          kubectl -n routebridge-staging rollout status deployment/web --timeout=300s
      - name: Smoke test
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors "${STAGING_API_URL}/ready"

  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      ACTION: ${{ inputs.action }}
      TAG: ${{ inputs.image_tag }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Canary (10% of API traffic; stable Deployments are not touched)
        if: inputs.action == 'canary'
        working-directory: backend/deploy/k8s/overlays/production-canary
        run: |
          test -n "$TAG"
          sed -i "s|newTag: canary|newTag: ${TAG}|" kustomization.yaml
          kubectl apply -k .
          kubectl -n routebridge rollout status deployment/api-canary --timeout=300s
          echo "Canary is live. Watch the 5xx rate and latency, then run this workflow with action=promote or rollback."
      - name: Promote this version to stable
        if: inputs.action == 'promote'
        working-directory: backend/deploy/k8s/overlays/production
        run: |
          test -n "$TAG"
          {
            echo "images:"
            echo "  - name: routebridge-api"
            echo "    newName: ${REGISTRY}/${OWNER}/routebridge-api"
            echo "    newTag: ${TAG}"
            echo "  - name: routebridge-web"
            echo "    newName: ${REGISTRY}/${OWNER}/routebridge-web"
            echo "    newTag: ${TAG}"
          } >> kustomization.yaml
          kubectl apply -k .
          kubectl -n routebridge rollout restart deployment/outbox-worker deployment/notification-worker
          kubectl -n routebridge rollout status deployment/api --timeout=600s
          kubectl -n routebridge rollout status deployment/web --timeout=600s
          kubectl -n routebridge delete deployment/api-canary service/api-canary ingress/routebridge-api-canary --ignore-not-found
      - name: Roll back
        if: inputs.action == 'rollback'
        run: |
          kubectl -n routebridge delete deployment/api-canary service/api-canary ingress/routebridge-api-canary --ignore-not-found
          kubectl -n routebridge rollout undo deployment/api
          kubectl -n routebridge rollout undo deployment/web
          kubectl -n routebridge rollout status deployment/api --timeout=600s
